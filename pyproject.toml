[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aca-ai"
version = "0.1.0"
description = "Question-Answer generation utilities and demo for ACA-AI project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name="UGcraft" } ]
keywords = ["nlp", "qa", "question-generation", "genai"]

dependencies = [
    "pydantic>=2.0,<3",
    "jinja2>=3.0",
    "google-genai",
    "datasets",
    "numpy",
    "pandas",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://example.org/aca-ai"

# Notes:
# - This pyproject.toml uses PEP 621 metadata with setuptools as the build backend.
# - Versions are minimal and conservative for main runtime deps; pin further if you need reproducible builds.
